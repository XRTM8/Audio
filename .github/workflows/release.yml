name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/otium_dsp -> rust/otium_dsp/target"

      - name: Install cargo-ndk (Prebuilt Binary)
        run: |
          mkdir -p ~/.cargo/bin
          curl -sSL "https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-musl-v4.1.2.tgz" | tar -xz -C ~/.cargo/bin
          chmod +x ~/.cargo/bin/cargo-ndk
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Rust Native DSP Engine (libotium_dsp.so)
        working-directory: rust/otium_dsp
        run: |
          cargo ndk -t aarch64-linux-android -t armv7-linux-androideabi -t x86_64 -o ../../app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Release APKs
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log || {
            echo "### Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "e: |error:|FAILURE:|Compilation error|What went wrong|Caused by:" build.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Publish Failure Log to Diagnostics Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-build-log
          git add -f build.log
          git commit -m "ci: capture build.log failure diagnostics" || true
          git push -f origin ci-build-log || true

      - name: Upload APKs to Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
